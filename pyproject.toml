[project]
name = "defi-contagion"
version = "0.1.0"
description = "DeFi Contagion: dependency discovery, risk simulation and exit decisions for a USDe-linked portfolio."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "eth-abi>=5.0",
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.7",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend", "tests"]
markers = ["live: hits Ethereum RPC and protocol APIs (run with DISCOVERY_LIVE=1)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
